<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="hTitle">
  <title id="hTitle">Automatic withdrawal illustration</title>
  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- wallet -->
  <g transform="translate(60,50)">
    <rect x="0" y="40" rx="18" ry="18" width="300" height="160" fill="#ffffff" stroke="#e2e8f0" />
    <rect x="220" y="20" rx="8" ry="8" width="60" height="30" fill="#06b6d4" />
    <text x="160" y="120" font-size="40" text-anchor="middle" fill="#0f172a">Wallet</text>
  </g>

  <!-- arrows and coins -->
  <g transform="translate(380,40)">
    <path d="M0 60 C60 10 140 10 200 60" stroke="#06b6d4" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="198,56 210,60 198,64" fill="#06b6d4" />
    <circle cx="120" cy="20" r="24" fill="#ffd166" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" font-weight="700" fill="#6b3e00" font-size="18">$</text>
    <circle cx="200" cy="140" r="24" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="200" y="148" text-anchor="middle" font-weight="700" fill="#3b0764" font-size="18">W</text>
  </g>

  <!-- scheduler clock -->
  <g transform="translate(620,70)">
    <circle cx="60" cy="60" r="56" fill="#fff" stroke="#e6e9ef" />
    <path d="M60 60 L60 34" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 60 L82 60" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <text x="60" y="120" text-anchor="middle" fill="#0f172a">Scheduler</text>
  </g>

  <!-- caption -->
  <text x="60" y="260" font-size="18" fill="#0f172a">Schedule withdrawals, watch them process automatically.</text>

</svg>
